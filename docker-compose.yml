services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_arena_local_only}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_arena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - cloud_arena_postgres_data:/var/lib/postgresql

volumes:
  cloud_arena_postgres_data:
