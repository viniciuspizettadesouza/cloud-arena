name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://cloud_arena:cloud_arena_ci@localhost:5432/cloud_arena
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cloud_arena
          POSTGRES_PASSWORD: cloud_arena_ci
          POSTGRES_USER: cloud_arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_arena -d cloud_arena"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and check package boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Check database connectivity
        run: pnpm db:check

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Run browser tests
        run: pnpm test:e2e
